name: Rakuten Gadget Hatena Blog Auto Poster

on:
  schedule:
    # 30分おき (毎時3分、33分) に実行 (GitHub Actions混雑回避のためオフセット設定)
    - cron: '3,33 * * * *'
  workflow_dispatch:
    inputs:
      search_keywords:
        description: '検索キーワード（空欄ならランダムで最新・人気ガジェットを自動選定）'
        required: false
        default: ''

jobs:
  auto-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Japanese fonts
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1

    - name: Run Auto Poster
      env:
        # Rakuten API Credentials
        RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
        RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

        # Hatena API Settings
        HATENA_ID: ${{ secrets.HATENA_ID }}
        HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
        HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}

        # Search Keywords
        SEARCH_KEYWORDS: ${{ github.event.inputs.search_keywords || '' }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: |
        python amazon_hatena_poster.py

    - name: Commit and push posted cache
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        if [ -f posted_cache.txt ]; then
          git add posted_cache.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update posted cache [skip ci]"
            git pull --rebase origin HEAD:${{ github.ref }} || git pull --rebase origin main || true
            git push origin HEAD:${{ github.ref }} || git push origin main || true
          else
            echo "No changes in cache file."
          fi
        else
          echo "Cache file not found."
        fi
